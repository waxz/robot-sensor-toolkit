[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "irsim-devices"
version = "0.1.0"
description = "Standalone sensor and actuator simulation models — IMU, LiDAR 2D/3D, encoder, DC motor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
lidar2d = ["shapely>=2.1.2", "matplotlib"]
lidar3d = ["open3d"]
open3d_scene = ["open3d", "shapely>=2.1.2"]
embree = ["pybind11>=2.12"]                        # native ext (lidar_embree.*.so)
urdf = ["trimesh>=4.0"]                            # irsim_devices.models: URDF -> triangle mesh
all = ["shapely>=2.1.2", "matplotlib", "open3d", "pybind11>=2.12", "trimesh>=4.0"]
dev = ["pytest", "numpy", "shapely>=2.1.2", "trimesh>=4.0"]

[project.urls]
Repository = "https://github.com/<your-org>/robot-sensor-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"irsim_devices" = ["*.so", "*.pyd"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
