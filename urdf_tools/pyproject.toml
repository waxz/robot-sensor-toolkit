[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urdf-tools"
version = "0.1.0"
description = "CLI tools for URDF visualization and sensor pub/sub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    # shmbridge: install from ../shmbridge/ (local C++ extension, built separately)
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
mesh = ["trimesh>=4.0"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/<your-org>/robot-sensor-toolkit"

[project.scripts]
urdf-tools = "urdf_tools.cli:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501"]
