world:
  height: 10
  width: 10
  step_time: 0.05   # 20 Hz
  sample_time: 0.05
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    state: [1.0, 1.0, 0.0]
    goal: [[9.0, 9.0, 0.0]]
    behavior: {name: 'dash'}
    sensors:
      - name: 'lidar2d'
        range_min: 0.1
        range_max: 8.0
        angle_range: 6.2832   # 2*pi (360°)
        number: 360
        noise: false
        offset: [0.0, 0.0, 0.0]
        plot:
          alpha: 0.15

obstacle:
  - shape: {name: 'circle', radius: 0.5}
    state: [5.0, 2.0, 0.0]
    static: true

  - shape: {name: 'circle', radius: 0.4}
    state: [3.0, 7.0, 0.0]
    static: true

  - shape: {name: 'rectangle', length: 1.5, width: 0.3}
    state: [7.0, 5.0, 0.8]
    static: true

  - shape: {name: 'rectangle', length: 0.3, width: 2.0}
    state: [2.0, 5.0, 0.0]
    static: true
